services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medicine_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-medicine_agent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    expose:
      - "5432"

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-medicine_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-medicine_agent}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-medicine_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-medicine_agent}_test
      KOKORO_MODEL_PATH: /app/models/kokoro/kokoro-v1.0.int8.onnx
      KOKORO_VOICES_PATH: /app/models/kokoro/voices-v1.0.bin
      VOICE_STT_MODEL: ${VOICE_STT_MODEL:-small}
      VOICE_PRELOAD_MODELS: ${VOICE_PRELOAD_MODELS:-true}
      VOICE_LLM_ENABLED: ${VOICE_LLM_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8001}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - model_cache:/app/model-cache

volumes:
  postgres_data:
  model_cache:
